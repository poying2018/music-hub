name: Build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Android APK build
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: lazer-apk
          path: androidApp/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # Version tags publish deliverables as release assets.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect deliverables
        run: |
          mkdir -p release
          find artifacts -type f -name '*.apk' -exec cp {} release/ \;
          ls -l release
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.apk
